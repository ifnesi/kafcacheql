<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc">
  <title id="title">KafCacheQL architecture</title>
  <desc id="desc">The KafCacheQL JDBC driver runs inside DBeaver, DataGrip or a Java application. Its query side plans the
offsets a query needs and runs the SQL on a local SQLite cache file; the sync worker, the only writer, fetches
missing records from Kafka; the decoder turns them into JSON using schemas fetched from Schema Registry by ID; optional per-topic
transforms then drop, mask or change fields before the sync worker writes the records to the cache.</desc>
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f4f6f8; stroke: #9aa5b1; }
    .driver { fill: #e8f0fe; stroke: #4a7bd0; }
    .box { fill: #ffffff; stroke: #4a5560; }
    .store { fill: #fff8e6; stroke: #b7862b; }
    .person { fill: #eef7ee; stroke: #4f8a4f; }
    .line { stroke: #3b4651; fill: none; stroke-width: 1.6; }
    .dash { stroke-dasharray: 6 4; }
    .head { fill: #3b4651; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .title { font-size: 15px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; fill: #3e4c59; }
    .label { font-size: 12px; fill: #2f3b47; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .group { fill: #161b22; stroke: #5a6572; }
      .driver { fill: #13233f; stroke: #5d8fe0; }
      .box { fill: #0d1117; stroke: #8b96a2; }
      .store { fill: #2a2112; stroke: #c99a3e; }
      .person { fill: #12251a; stroke: #63a363; }
      .line { stroke: #c4ccd4; }
      .head { fill: #c4ccd4; }
      text { fill: #e6edf3; }
      .note { fill: #b8c2cc; }
      .label { fill: #cdd5dd; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="570"/>

  <!-- You -->
  <rect class="person" x="18" y="80" width="80" height="40" rx="20" stroke-width="1.5"/>
  <text class="name" x="58" y="105" text-anchor="middle">User</text>

  <!-- The tool's process -->
  <rect class="group" x="125" y="20" width="620" height="395" rx="12" stroke-width="1.5"/>
  <text class="title" x="145" y="45">DBeaver, DataGrip or your Java app (one process)</text>

  <rect class="box" x="155" y="65" width="200" height="55" rx="6" stroke-width="1.5"/>
  <text class="name" x="255" y="90" text-anchor="middle">SQL editor or app code</text>
  <text class="note" x="255" y="108" text-anchor="middle">JDBC</text>

  <!-- The driver -->
  <rect class="driver" x="145" y="165" width="580" height="235" rx="10" stroke-width="1.5"/>
  <text class="title" x="165" y="190">KafCacheQL JDBC driver</text>

  <rect class="box" x="165" y="215" width="160" height="90" rx="6" stroke-width="1.5"/>
  <text class="name" x="245" y="240" text-anchor="middle">Query side</text>
  <text class="note" x="245" y="260" text-anchor="middle">parses the SQL, works</text>
  <text class="note" x="245" y="276" text-anchor="middle">out the offsets it needs,</text>
  <text class="note" x="245" y="292" text-anchor="middle">runs it on the cache</text>

  <rect class="box" x="395" y="215" width="140" height="90" rx="6" stroke-width="1.5"/>
  <text class="name" x="465" y="240" text-anchor="middle">Sync worker</text>
  <text class="note" x="465" y="260" text-anchor="middle">Kafka consumers,</text>
  <text class="note" x="465" y="276" text-anchor="middle">the only writer</text>

  <rect class="box" x="590" y="215" width="120" height="90" rx="6" stroke-width="1.5"/>
  <text class="name" x="650" y="240" text-anchor="middle">Decoder</text>
  <text class="note" x="650" y="260" text-anchor="middle">Avro, JSON Schema,</text>
  <text class="note" x="650" y="276" text-anchor="middle">Protobuf, plain JSON</text>
  <text class="note" x="650" y="292" text-anchor="middle">to JSON</text>

  <rect class="box dash" x="590" y="325" width="120" height="62" rx="6" stroke-width="1.5"/>
  <text class="name" x="650" y="345" text-anchor="middle">Transforms</text>
  <text class="note" x="650" y="363" text-anchor="middle">optional, per topic:</text>
  <text class="note" x="650" y="379" text-anchor="middle">drop, mask, Java</text>

  <!-- Stores -->
  <path class="store" stroke-width="1.5" d="M800,150 a85,12 0 0 1 170,0 v62 a85,12 0 0 1 -170,0 z"/>
  <path class="line" d="M800,150 a85,12 0 0 0 170,0"/>
  <text class="name" x="885" y="190" text-anchor="middle">Kafka</text>
  <text class="note" x="885" y="208" text-anchor="middle">topics</text>

  <path class="store" stroke-width="1.5" d="M800,300 a85,12 0 0 1 170,0 v62 a85,12 0 0 1 -170,0 z"/>
  <path class="line" d="M800,300 a85,12 0 0 0 170,0"/>
  <text class="name" x="885" y="340" text-anchor="middle">Schema Registry</text>
  <text class="note" x="885" y="358" text-anchor="middle">when topics use it</text>

  <path class="store" stroke-width="1.5" d="M315,455 a150,14 0 0 1 300,0 v70 a150,14 0 0 1 -300,0 z"/>
  <path class="line" d="M315,455 a150,14 0 0 0 300,0"/>
  <text class="name" x="465" y="495" text-anchor="middle">SQLite cache file</text>
  <text class="note" x="465" y="514" text-anchor="middle">one file per cluster, one view per topic</text>

  <!-- You and the tool -->
  <path class="line" marker-end="url(#arrow)" d="M98,100 H155"/>

  <!-- Tool and query side -->
  <path class="line" marker-end="url(#arrow)" d="M205,120 V215"/>
  <text class="label" x="198" y="158" text-anchor="end">SQL</text>
  <path class="line" marker-end="url(#arrow)" d="M290,215 V120"/>
  <text class="label" x="297" y="158">result set</text>

  <!-- Inside the driver -->
  <path class="line" marker-end="url(#arrow)" d="M325,268 H395"/>
  <text class="label" x="378" y="260" text-anchor="middle">missing</text>
  <text class="label" x="378" y="286" text-anchor="middle">offsets</text>
  <path class="line" marker-end="url(#arrow)" d="M535,245 H590"/>
  <text class="label" x="562" y="238" text-anchor="middle">records</text>
  <path class="line" marker-end="url(#arrow)" d="M650,305 V325"/>
  <text class="label" x="657" y="319">JSON</text>
  <path class="line" marker-end="url(#arrow)" d="M590,356 H512 V305"/>
  <text class="label" x="551" y="349" text-anchor="middle">to store</text>

  <!-- To Kafka -->
  <path class="line dash" marker-end="url(#arrow)" d="M325,228 H365 V142 H800"/>
  <text class="label" x="580" y="135" text-anchor="middle">topic list, description and offsets (per query)</text>
  <path class="line" marker-end="url(#arrow)" d="M500,215 V172 H800"/>
  <text class="label" x="650" y="192" text-anchor="middle">fetch missing records</text>

  <!-- To Schema Registry -->
  <path class="line" marker-end="url(#arrow)" d="M710,290 H760 V331 H800"/>
  <text class="label" x="772" y="270">schemas by ID, once</text>

  <!-- To the cache -->
  <path class="line" marker-end="url(#arrow)" d="M465,305 V441"/>
  <text class="label" x="473" y="430">write batches</text>
  <path class="line" marker-end="url(#arrow)" d="M245,305 V490 H315"/>
  <text class="label" x="253" y="430">run the SQL, read rows</text>
</svg>
