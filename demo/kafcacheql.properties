# KafCacheQL settings for the demo. Zeppelin connects with
#   jdbc:kafcacheql://broker:29092?config.file=/demo/kafcacheql.properties
# so the broker address comes from the URL and everything else from this file.
# Every setting is described in docs/configuration.md.

# Where the driver fetches Avro, JSON Schema and Protobuf schemas to decode records.
schema.registry.url=http://schema-registry:8081

# The local SQLite file that holds the cached records. Queries read from it; the driver
# fetches only what the cache is missing. Delete it to start from scratch.
cache.path=/cache/store.db

# Which topics the tools list (a regular expression). A listing filter only: any topic can
# still be queried by name.
topics.include=shop-.*

# For append-only topics, a query with no _offset or _timestamp condition reads only the
# last 15 minutes (capped at 10,000 records per partition). Use "all" to read the whole topic.
append.default.window=15m

# Name the driver's Kafka clients report to the broker, handy for spotting them in logs.
client.id=kafcacheql-demo

# ---------------------------------------------------------------------------------------
# Record transforms: change records after decoding and before they reach the cache, so the
# fields below are never stored on disk or shown in query results. Kafka itself still holds
# the originals. See docs/transforms.md.
#
#   drop          remove fields (value fields by name, "a.b" for nested ones, "_key.x" for a
#                 key field, "_key" or "_value" for the whole key or value)
#   mask          replace fields with a hash: the same input always gives the same hash, so
#                 masked values still join and group, but the original can't be read back
#   drop.headers  remove Kafka headers by exact name
#   mask.headers  replace header values with a hash
#   transform     a Java class for anything else; it runs first, then drop and mask
# ---------------------------------------------------------------------------------------

# Key for the hashes. Required by any transform. Demonstration only: outside this demo use
# your own long random value, keep it out of URLs, and keep it the same, because changing
# it rebuilds every transformed topic on its next query.
mask.secret=web-store-demo-only-not-for-production

# Customer profiles, without Java code. The key (an email address), the email and the
# postcode become hashes, so profiles can still be joined by them; the phone number, birth
# date and street are dropped. The authorization header is removed and the client IP hashed.
topic.shop-customer-profiles.mask=_key,email,address.postcode
topic.shop-customer-profiles.drop=phone,birth_date,address.street
topic.shop-customer-profiles.drop.headers=authorization
topic.shop-customer-profiles.mask.headers=client-ip

# Customer notes, with a Java class (demo/transforms/demo/ShopPrivacy.java). The class turns
# the birth date into an age band and removes email addresses from the note text. Then the
# settings below hash the email field, drop the key and the birth date, and treat the
# headers like the profiles topic.
topic.shop-customer-notes.transform=demo.ShopPrivacy
topic.shop-customer-notes.mask=email
topic.shop-customer-notes.drop=_key,birth_date
topic.shop-customer-notes.drop.headers=authorization
topic.shop-customer-notes.mask.headers=client-ip
