name: kafcacheql-demo
services:
  transforms:
    image: eclipse-temurin:21.0.9_10-jdk-jammy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        javac --release 21 -cp /driver/kafcacheql-jdbc.jar -d /tmp/classes /source/demo/ShopPrivacy.java &&
        jar --create --file /transforms/shop-transforms.jar -C /tmp/classes demo
    volumes:
      - ../target:/driver:ro
      - ./transforms:/source:ro
      - transforms:/transforms
    networks: [stack]
  zeppelin:
    build: ./zeppelin
    depends_on:
      transforms:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_NOTEBOOK_DIR: /notebook
      ZEPPELIN_IN_DOCKER: "true"
    volumes:
      - ../target:/driver:ro
      - ./kafcacheql.properties:/demo/kafcacheql.properties:ro
      - transforms:/transforms:ro
      - cache:/cache
      - notebook:/notebook
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/version"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [stack]
  configure:
    build: ./producer
    command: ["python", "/demo/configure.py"]
    volumes:
      - ./zeppelin:/demo:ro
    depends_on:
      zeppelin:
        condition: service_healthy
    networks: [stack]
  producer:
    build: ./producer
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ORDERS_PER_SECOND: ${ORDERS_PER_SECOND:-2}
    depends_on:
      configure:
        condition: service_completed_successfully
    networks: [stack]
  # One-shot check of every note paragraph: docker compose -f demo/compose.yaml run --rm check
  check:
    build: ./producer
    command: ["python", "/demo/check.py"]
    environment:
      ZEPPELIN_URL: http://zeppelin:8080
    volumes:
      - ./check.py:/demo/check.py:ro
      - ./zeppelin/store.json:/demo/zeppelin/store.json:ro
    profiles: [check]
    networks: [stack]
volumes:
  transforms:
  cache:
  notebook:
networks:
  stack:
    external: true
    name: kafcacheql
